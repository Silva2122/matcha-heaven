<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matcha Heaven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f1eb;              /* rice paper */
    --ink:#1c3a20;             /* deep matcha */
    --muted:rgba(28,58,32,.66);
    --gold:#b48b36;
    --line:rgba(28,58,32,.14);
    --reveal:150px;
    --x:50vw; --y:50vh;
    --nav:84px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    overflow:hidden;
    cursor:none;
    -webkit-font-smoothing:antialiased;
  }
  img{display:block; -webkit-user-drag:none; user-select:none}

  .hero{
    position:relative;
    height:100vh; height:100svh;
    overflow:hidden;
    isolation:isolate;
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 55% 45% at 50% 70%, rgba(154,190,90,.16), transparent 70%),
      linear-gradient(180deg, #f6f5ef 0%, #f2f1eb 55%, #ebebe2 100%);
  }

  /* the whole scene is one picture pushed into 3D by a depth map (WebGL) */
  #gl{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    opacity:0;
    transition:opacity 1.2s ease;
  }
  #gl.ready{opacity:1}
  #gl{z-index:3}

  /* ---------- headline above the picture ---------- */
  .title{
    position:absolute;
    top:calc(var(--nav) + 1.5vh); left:0; right:0;
    z-index:1;                 /* under the canvas: the cup and leaves pass in front of it */
    text-align:center;
    pointer-events:none;
    user-select:none;
    font-family:"Cormorant Garamond",serif;
    font-weight:300;
    font-size:8vw;             /* refined by JS */
    line-height:.85;
    letter-spacing:0;
    text-transform:uppercase;
    white-space:nowrap;
    color:var(--ink);
    animation:rise 1.6s cubic-bezier(.19,1,.22,1) .2s both;
  }
  .title em{font-style:italic;font-weight:300;color:var(--gold)}
  .title .word{display:inline-block}

  /* the picture: a soft shadow under the rounded panel the shader paints */
  .panel-shadow{
    position:absolute; z-index:2;
    border-radius:var(--r, 22px);
    box-shadow:0 50px 90px -40px rgba(28,58,32,.45), 0 0 0 1px rgba(28,58,32,.08);
    pointer-events:none;
    animation:rise 1.8s cubic-bezier(.19,1,.22,1) .3s both;
  }

  /* ---------- nav ---------- */
  .nav{
    position:absolute; inset:0 0 auto 0;
    display:flex; justify-content:space-between; align-items:center;
    padding:28px 40px;
    z-index:40;
    font-size:12px; letter-spacing:0; text-transform:uppercase;
    color:var(--muted);
    animation:rise 1.4s cubic-bezier(.19,1,.22,1) .2s both;
  }
  .nav a{color:inherit;text-decoration:none;transition:color .3s}
  .nav a:hover{color:var(--ink)}
  .nav .mark{font-family:"Cormorant Garamond",serif;font-size:20px;letter-spacing:0;text-transform:none;color:var(--ink)}
  .nav ul{display:flex;gap:36px;list-style:none}
  .nav .order{
    color:var(--ink);
    border:1px solid rgba(28,58,32,.3);
    padding:9px 18px;
    border-radius:999px;
    transition:border-color .3s, background .3s;
  }
  .nav .order:hover{border-color:var(--ink); background:rgba(255,255,255,.6)}

  /* ---------- card ---------- */
  .side{
    position:absolute;
    right:40px; bottom:108px;
    z-index:20;
    width:clamp(200px, 14vw, 236px);
    animation:rise 1.6s cubic-bezier(.19,1,.22,1) 1.1s both;
  }
  .card{
    width:100%;
    padding:18px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.7);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:border-color .4s, background .4s;
  }
  .card:hover{border-color:rgba(28,58,32,.36); background:rgba(255,255,255,.9)}
  .card .pic{
    position:relative;
    margin:-18px -18px 14px;
    aspect-ratio:16/9;
    overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .card .pic img{
    width:100%; height:100%; object-fit:cover;
    transform:scale(1.04);
    transition:transform 1.6s cubic-bezier(.19,1,.22,1);
  }
  .card:hover .pic img{transform:scale(1.12)}
  .card .pic figcaption{
    position:absolute; left:12px; bottom:8px;
    font-family:"Cormorant Garamond",serif; font-style:italic;
    font-size:13px; color:#fff;
    text-shadow:0 1px 8px rgba(0,0,0,.4);
  }
  .card .lbl{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:10px; text-transform:uppercase; color:var(--muted);
    margin-bottom:10px;
  }
  .card h3{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:26px;line-height:1.05;margin-bottom:8px}
  .card h3 em{font-style:italic;font-weight:300}
  .card p{font-size:13px;line-height:1.5;color:var(--muted);font-weight:300}
  .card .more{
    display:inline-block; margin-top:14px;
    font-size:10px; text-transform:uppercase;
    color:var(--ink); text-decoration:none;
    border-bottom:1px solid rgba(28,58,32,.25);
    padding-bottom:4px;
    transition:border-color .3s;
  }
  .card .more:hover{border-color:var(--ink)}
  @media (max-width:1040px){ .side{display:none} }

  /* ---------- footer line ---------- */
  .foot{
    position:absolute; inset:auto 0 0 0;
    display:flex; justify-content:space-between; align-items:flex-end;
    padding:32px 40px;
    z-index:20;
    font-size:11px; text-transform:uppercase;
    color:var(--muted);
    animation:rise 1.4s ease 1.3s both;
  }
  .foot .cta{
    display:inline-flex; align-items:center; gap:14px;
    color:var(--ink); text-decoration:none;
    border-bottom:1px solid rgba(28,58,32,.25);
    padding-bottom:6px;
    transition:border-color .3s;
  }
  .foot .cta:hover{border-color:var(--ink)}
  .foot .cta span.line{width:40px;height:1px;background:currentColor;display:inline-block}
  .foot .hint{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:15px;text-transform:none}

  @keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

  /* subtle grain */
  .hero::after{
    content:"";
    position:absolute; inset:0; z-index:30; pointer-events:none;
    opacity:.045;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- custom cursor: beaded ring + tea leaf ---------- */
  .cursor{
    position:fixed; top:0; left:0;
    width:var(--reveal); height:var(--reveal);
    transform:translate(calc(var(--x) - 50%), calc(var(--y) - 50%));
    pointer-events:none;
    z-index:50;
    transition:width .35s ease, height .35s ease, opacity .4s ease;
    opacity:0;
  }
  .cursor svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
  .cursor .ring{
    fill:none; stroke:var(--ink);
    stroke-width:1.6; stroke-linecap:round;
    stroke-dasharray:0 9.5;
    opacity:.7;
    transform-origin:50% 50%;
    animation:turn 26s linear infinite;
  }
  .cursor .ring2{fill:none; stroke:var(--ink); stroke-width:.6; opacity:.3}
  .cursor .leaf{transform-origin:50% 50%; animation:turn 18s linear infinite reverse}
  .cursor .leaf path{fill:url(#leafg)}
  body.over-link .cursor{--reveal:96px}
  body.has-pointer .cursor{opacity:1}
  @keyframes turn{to{transform:rotate(360deg)}}

  @media (max-width:720px){
    .nav{padding:20px 22px} .nav ul{display:none}
    .foot{padding:22px; flex-direction:column; gap:18px; align-items:flex-start}
    body{cursor:auto} .cursor{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .side,.foot,.nav{animation:none}
  }
</style>
</head>
<body>

<main class="hero" id="hero">
  <canvas id="gl" aria-label="An iced matcha latte held out toward you from a sky fresco with a goddess and a gilded arch"></canvas>
  <h1 class="title" id="title"><span class="word" id="word">Leaf <em>&amp;</em> Light</span></h1>
  <div class="panel-shadow" id="shadow"></div>

  <nav class="nav">
    <a class="mark" href="#">Matcha Heaven</a>
    <ul>
      <li><a href="#">Menu</a></li>
      <li><a href="#">Locations</a></li>
      <li><a href="#">About</a></li>
    </ul>
    <a class="order" href="#">Order</a>
  </nav>

  <aside class="side">
    <div class="card">
      <figure class="pic"><img src="img/card-muse.webp" alt="A muse with a golden laurel against the sky"><figcaption>The muse, ceiling fresco</figcaption></figure>
      <div class="lbl"><span>Signature</span><span>Iced · 450 ml</span></div>
      <h3>Heaven <em>Latte</em></h3>
      <p>Stone-ground Uji matcha whisked over oat milk and ice, with a thread of wild honey.</p>
      <a class="more" href="#">See the menu</a>
    </div>
  </aside>

  <div class="foot">
    <a class="cta" href="#"><span class="line"></span>Order for pickup</a>
    <span class="hint">Exceptional tea for brighter days</span>
  </div>
</main>

<div class="cursor" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <defs>
      <linearGradient id="leafg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8fbf4a"/>
        <stop offset=".6" stop-color="#3f7a2a"/>
        <stop offset="1" stop-color="#1c3a20"/>
      </linearGradient>
    </defs>
    <circle class="ring2" cx="50" cy="50" r="48"/>
    <circle class="ring" cx="50" cy="50" r="48"/>
    <g class="leaf">
      <path d="M50 34 C60 40 60 58 50 66 C40 58 40 40 50 34 Z"/>
      <path d="M50 36 L50 64" stroke="#e9f2d6" stroke-width=".7" fill="none"/>
    </g>
  </svg>
</div>

<script>
(async () => {
  const root   = document.documentElement;
  const body   = document.body;
  const canvas = document.getElementById('gl');
  const still  = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const INK = '#1c3a20', GOLD = '#b48b36';

  // ---------- load the layers ----------
  const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const [sky, arch, goddess, cup, leaves] = await Promise.all(
    ['sky', 'arch', 'goddess', 'matcha', 'leaves-clean'].map(n => load(`img/${n}.webp`))
  );
  try {
    await Promise.all([
      document.fonts.load('300 100px "Cormorant Garamond"'),
      document.fonts.load('italic 300 100px "Cormorant Garamond"'),
    ]);
  } catch (e) {}

  // ---------- layout: title on top, the picture below it, the cup breaking out ----------
  const title  = document.getElementById('title');
  const word   = document.getElementById('word');
  const shadow = document.getElementById('shadow');
  let panel = { x: 0, y: 0, w: 0, h: 0, r: 22 };   // CSS px

  const layout = () => {
    title.style.fontSize = '100px';
    const tw = word.getBoundingClientRect().width;
    title.style.fontSize = (100 * innerWidth * 0.6 / tw) + 'px';
    const tb = title.getBoundingClientRect().bottom;
    const top = tb + Math.max(18, innerHeight * 0.03);
    const h = innerHeight - 36 - top;
    const w = Math.min(h * 1.42, innerWidth * 0.62);
    panel = { x: (innerWidth - w) / 2, y: top, w, h, r: Math.round(Math.min(w, h) * 0.035) };
    Object.assign(shadow.style, { left: panel.x + 'px', top: panel.y + 'px', width: w + 'px', height: h + 'px' });
    shadow.style.setProperty('--r', panel.r + 'px');
  };

  // ---------- paint each plane into its own texture at screen size ----------
  // Planes, far to near: back (sky + arch), goddess, cup, leaves.
  let W = 0, H = 0, dpr = 1;
  const planes = ['back', 'goddess', 'cup', 'leaves'].map(() => {
    const c = document.createElement('canvas');
    return { c, x: c.getContext('2d') };
  });

  let cupCenter = [0.3, 0.6], cupPivot = [0.3, 0.8];
  const compose = () => {
    layout();
    dpr = Math.min(devicePixelRatio || 1, 1.5);
    W = Math.round(innerWidth * dpr); H = Math.round(innerHeight * dpr);
    const P = { x: panel.x * dpr, y: panel.y * dpr, w: panel.w * dpr, h: panel.h * dpr };

    // the fresco covers the panel with room to move, nudged right so the goddess sits right of centre
    // overscan on every side so a moving camera never looks past the edge of the fresco
    const sw = Math.max(P.w * 1.26, P.h * 1.26 * 1448 / 1086), sh = sw * 1086 / 1448;
    const S = { x: P.x + (P.w - sw) / 2 + P.w * 0.05, y: P.y + (P.h - sh) / 2 - P.h * 0.02, w: sw, h: sh };

    // the cup: her hand comes out of the empty fold of the drapery (≈33% / 58% of the fresco)
    // and holds the glass out to you; the wrist sits behind the thumb (≈48% / 52% of the cup image)
    const ch = P.h * 0.86 * 1086 / 829, cw = ch * 1448 / 1086;
    // the sleeve opening sits at ≈38% / 57% of the fresco; the wrist is hidden behind the
    // bottom of the glass (≈31% / 86% of the cup image), so that point goes into the sleeve
    const C = { x: S.x + S.w * 0.378 - cw * 0.31, y: S.y + S.h * 0.572 - ch * 0.86, w: cw, h: ch };

    // leaves drift over the whole screen
    const lw = Math.max(W * 1.1, H * 1.1 * 1448 / 1086), lh = lw * 1086 / 1448;
    const L = { x: (W - lw) / 2, y: (H - lh) / 2, w: lw, h: lh };

    for (const pl of planes) { pl.c.width = W; pl.c.height = H; pl.x.clearRect(0, 0, W, H); }
    planes[0].x.drawImage(sky, 0, 0, W, H);            // safety net: sky behind everything
    planes[0].x.drawImage(sky,     S.x, S.y, S.w, S.h);
    planes[0].x.drawImage(arch,    S.x, S.y, S.w, S.h);
    planes[1].x.drawImage(goddess, S.x, S.y, S.w, S.h);
    planes[2].x.drawImage(cup,     C.x, C.y, C.w, C.h);
    planes[3].x.drawImage(leaves,  L.x, L.y, L.w, L.h);
    cupCenter = [(C.x + C.w * 0.2925) / W, (C.y + C.h * 0.56) / H];
    cupPivot = [(C.x + C.w * 0.31) / W, (C.y + C.h * 0.86) / H];
  };

  // ---------- WebGL: every plane is shifted by its own depth, then stacked ----------
  const gl = canvas.getContext('webgl', { antialias: false, premultipliedAlpha: false, alpha: true });
  const fallback = () => {
    const ctx = canvas.getContext('2d');
    const draw = () => {
      compose(); canvas.width = W; canvas.height = H;
      ctx.save(); ctx.beginPath();
      ctx.roundRect(panel.x * dpr, panel.y * dpr, panel.w * dpr, panel.h * dpr, panel.r * dpr); ctx.clip();
      ctx.drawImage(planes[0].c, 0, 0); ctx.drawImage(planes[1].c, 0, 0); ctx.restore();
      ctx.drawImage(planes[2].c, 0, 0); ctx.drawImage(planes[3].c, 0, 0);
    };
    draw(); addEventListener('resize', draw);
    canvas.classList.add('ready');
  };
  if (!gl) return fallback();

  const vs = `
    attribute vec2 p; varying vec2 v;
    void main(){ v = p * .5 + .5; v.y = 1. - v.y; gl_Position = vec4(p, 0., 1.); }`;
  const fs = `
    precision highp float;
    uniform sampler2D uBack, uGoddess, uCup, uLeaves;
    uniform vec2 uShift;      // camera offset from the cursor
    uniform float uPush;      // pull toward the viewer (intro)
    uniform vec2 uCupC;       // centre of the glass on screen
    uniform vec2 uCupPivot;   // the wrist, where the hand enters the sleeve
    uniform vec2 uRes;        // canvas size in px
    uniform vec4 uPanel;      // x, y, w, h in px
    uniform float uRadius;    // corner radius in px
    varying vec2 v;
    const float F = .3;       // the picture plane stays still

    vec2 at(vec2 p, float d){ return p - uShift * (d - F) - (p - uCupC) * (d - F) * uPush; }
    vec4 tap(sampler2D t, vec2 q){
      vec4 c = texture2D(t, clamp(q, 0., 1.));
      // fade out softly at the texture border instead of cutting a hard line
      vec2 e = smoothstep(0., .04, q) * smoothstep(0., .04, 1. - q);
      return c * e.x * e.y;
    }
    void over(inout vec4 acc, vec4 c){ acc.rgb += (1. - acc.a) * c.rgb * c.a; acc.a += (1. - acc.a) * c.a; }
    // rounded-rectangle mask of the picture, anti-aliased
    float panelMask(vec2 px){
      vec2 c = uPanel.xy + uPanel.zw * .5;
      vec2 q = abs(px - c) - uPanel.zw * .5 + uRadius;
      float d = length(max(q, 0.)) + min(max(q.x, q.y), 0.) - uRadius;
      return 1. - smoothstep(-.75, .75, d);
    }

    void main(){
      vec2 p = v;
      vec4 acc = vec4(0.);

      // leaves: right in your face
      over(acc, tap(uLeaves, at(p, 1.1)));

      // cup: a rigid glass — it moves with the sleeve and swings around the wrist, never bends
      vec2 A = vec2(uRes.x / uRes.y, 1.);
      float dw = .34 + .26 * uCupPivot.y;              // same depth as the fabric at the sleeve
      vec2 d = (p - uCupPivot + uShift * (dw - F)) * A; // follow the sleeve
      float ang = uShift.x * 1.6;                      // tilt toward the cursor
      float sc = (1. + uPush * .9) * (1. - uShift.y * .9);
      d = mat2(cos(ang), sin(ang), -sin(ang), cos(ang)) * d / sc;
      over(acc, tap(uCup, uCupPivot + d / A));

      // inside the picture: the goddess leans back, the sky is a far dome
      float m = panelMask(p * uRes);
      vec4 g = tap(uGoddess, at(p, .34 + .26 * p.y));
      over(acc, vec4(g.rgb, g.a * m));
      vec4 b = texture2D(uBack, clamp(at(p, .02 + .14 * p.y), 0., 1.));
      over(acc, vec4(b.rgb, m));

      // straight (non-premultiplied) output so the page shows around the picture
      gl_FragColor = acc.a > 0. ? vec4(acc.rgb / acc.a, acc.a) : vec4(0.);
    }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; };
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    gl.useProgram(prog);
  } catch (e) { console.warn(e); return fallback(); }

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const U = n => gl.getUniformLocation(prog, n);
  const names = ['uBack', 'uGoddess', 'uCup', 'uLeaves'];
  const texs = names.map((n, i) => {
    const t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + i);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.uniform1i(U(n), i);
    return t;
  });
  const uShift = U('uShift'), uPush = U('uPush'), uCupC = U('uCupC'), uRes = U('uRes'), uPanel = U('uPanel'), uRadius = U('uRadius'), uCupPivot = U('uCupPivot');

  const upload = () => {
    compose();
    canvas.width = W; canvas.height = H;
    gl.viewport(0, 0, W, H);
    planes.forEach((pl, i) => {
      gl.activeTexture(gl.TEXTURE0 + i);
      gl.bindTexture(gl.TEXTURE_2D, texs[i]);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, pl.c);
    });
    gl.uniform2f(uCupC, cupCenter[0], cupCenter[1]);
    gl.uniform2f(uCupPivot, cupPivot[0], cupPivot[1]);
    gl.uniform2f(uRes, W, H);
    gl.uniform4f(uPanel, panel.x * dpr, panel.y * dpr, panel.w * dpr, panel.h * dpr);
    gl.uniform1f(uRadius, panel.r * dpr);
  };
  let rz;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(upload, 120); });
  upload();
  canvas.classList.add('ready');

  // ---------- pointer ----------
  let tx = 0, ty = 0, nx = 0, ny = 0;
  let mx = innerWidth / 2, my = innerHeight / 2, cx = mx, cy = my;
  let idle = true, t = 0;
  const t0 = performance.now();

  addEventListener('pointermove', e => {
    mx = e.clientX; my = e.clientY; idle = false;
    tx = (mx / innerWidth) * 2 - 1;
    ty = (my / innerHeight) * 2 - 1;
    body.classList.add('has-pointer');
  }, {passive:true});
  document.addEventListener('mouseleave', () => { idle = true; body.classList.remove('has-pointer'); });
  document.querySelectorAll('a').forEach(a => {
    a.addEventListener('pointerenter', () => body.classList.add('over-link'));
    a.addEventListener('pointerleave', () => body.classList.remove('over-link'));
  });

  const frame = now => {
    if (idle) {
      t += 0.006;
      tx = Math.sin(t) * 0.55;
      ty = Math.sin(2 * t) * 0.35;
    }
    nx += (tx - nx) * 0.06;
    ny += (ty - ny) * 0.06;
    cx += (mx - cx) * 0.22;
    cy += (my - cy) * 0.22;
    root.style.setProperty('--x', cx + 'px');
    root.style.setProperty('--y', cy + 'px');

    // intro: the cup starts pressed right up to you and settles back
    const k = Math.min(1, (now - t0) / 2600);
    const intro = 1 - Math.pow(1 - k, 3);
    const push = still ? 0.03 : 0.03 + (1 - intro) * 0.22;

    // the camera orbits with the cursor: near things swing the most
    gl.uniform2f(uShift, still ? 0 : nx * 0.06, still ? 0 : ny * 0.045);
    gl.uniform1f(uPush, push);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();
</script>
